[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-infer"
version = "0.2.7"
description = "A minimal, high-performance continuous-batching LLM inference engine with paged KV-cache, prefix caching, and speculative decoding for Qwen2.5."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Prajwal Pujari", email = "prajwalpujari16@gmail.com" }]
keywords = ["llm", "inference", "continuous-batching", "paged-attention", "kv-cache", "speculative-decoding", "qwen2.5", "serving"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "torch>=2.4.0",
    "safetensors>=0.4.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "rich>=13",
    "typer>=0.12",
    "transformers>=4.40",
    "quantbench-engine>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
    "mkdocs-material>=9.5",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
mini-infer = "mini_infer.cli:app"

[project.urls]
Homepage = "https://github.com/Prajwal7-2002/mini-infer"
Documentation = "https://prajwal7-2002.github.io/mini-infer/"
Repository = "https://github.com/Prajwal7-2002/mini-infer"
Issues = "https://github.com/Prajwal7-2002/mini-infer/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

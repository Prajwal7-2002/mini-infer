<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1124" />
      <stop offset="50%" stop-color="#090a16" />
      <stop offset="100%" stop-color="#04050a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(139, 92, 246, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Top Accent Border -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#borderGrad)" stroke-width="4" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Ambient Light Blobs -->
  <circle cx="160" cy="180" r="140" fill="#8b5cf6" opacity="0.08" filter="url(#glow)" />
  <circle cx="1040" cy="120" r="180" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />

  <!-- LEFT: Graphic Icon Paged Virtual Memory Matrix (180x180) -->
  <g transform="translate(70, 90)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="180" height="180" rx="36" fill="#090d16" stroke="url(#violetGrad)" stroke-width="2" />
    <rect x="12" y="12" width="156" height="156" rx="26" fill="#0e0f24" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1" />

    <!-- 4 Interlocking Paged Memory Blocks -->
    <rect x="26" y="26" width="58" height="58" rx="12" fill="#1e1b4b" stroke="url(#violetGrad)" stroke-width="1.5" />
    <text x="55" y="60" fill="#a78bfa" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">PAGE</text>

    <rect x="96" y="26" width="58" height="58" rx="12" fill="#0c4a6e" stroke="url(#blueGrad)" stroke-width="1.5" filter="url(#glow)" />
    <text x="125" y="60" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">16-TOK</text>

    <rect x="26" y="96" width="58" height="58" rx="12" fill="#082f49" stroke="url(#blueGrad)" stroke-width="1.5" />
    <text x="55" y="130" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">RADIX</text>

    <rect x="96" y="96" width="58" height="58" rx="12" fill="#2e1065" stroke="url(#violetGrad)" stroke-width="1.5" filter="url(#glow)" />
    <!-- Dynamic Arrow -->
    <path d="M 112 125 L 138 125 M 128 115 L 138 125 L 128 135" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- RIGHT: Branding Text & Typography -->
  <g transform="translate(300, 68)">
    <!-- Monospace Pill Badge -->
    <g>
      <rect x="0" y="0" width="375" height="28" rx="14" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#a78bfa" filter="url(#glow)" />
      <text x="28" y="18" fill="#a78bfa" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">CONTINUOUS-BATCHING INFERENCE RUNTIME</text>
    </g>

    <!-- Title -->
    <text x="0" y="94" fill="url(#textGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      mini-infer <tspan fill="#8b5cf6" font-size="52">🚀</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="-0.2">
      Lightweight Continuous-Batching LLM Engine with Paged KV-Cache in Pure PyTorch
    </text>

    <!-- Feature Tags Strip -->
    <g transform="translate(2, 172)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="186" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">⚡ 27.0 tok/s at c=4 (+130%)</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(196, 0)">
        <rect width="168" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🧠 Paged KV-Cache VRAM</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(374, 0)">
        <rect width="164" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🌲 Radix Prefix Cache</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(548, 0)">
        <rect width="166" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🎯 Speculative Verifier</text>
      </g>

      <!-- Tag 5 -->
      <g transform="translate(724, 0)">
        <rect width="148" height="34" rx="8" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
        <text x="14" y="21" fill="#c4b5fd" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">📦 Zero C++ Toolchain</text>
      </g>
    </g>
  </g>
</svg>


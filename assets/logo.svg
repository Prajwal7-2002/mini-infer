<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Paged Virtual Memory Block Mesh -->
  <g opacity="0.25">
    <rect x="100" y="100" width="70" height="70" rx="12" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="2" />
    <rect x="185" y="100" width="70" height="70" rx="12" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2" />
    <rect x="270" y="100" width="70" height="70" rx="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4,4" />
    <rect x="355" y="100" width="70" height="70" rx="12" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="2" />

    <rect x="100" y="355" width="70" height="70" rx="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4,4" />
    <rect x="185" y="355" width="70" height="70" rx="12" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="2" />
    <rect x="270" y="355" width="70" height="70" rx="12" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2" />
    <rect x="355" y="355" width="70" height="70" rx="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Central Interlocking KV Blocks Matrix (2x2 Glowing Hero Blocks) -->
  <g transform="translate(146, 146)">
    <!-- Block 0: Virtual Block -->
    <rect x="0" y="0" width="102" height="102" rx="18" fill="#1e1b4b" stroke="url(#violetGrad)" stroke-width="3" />
    <text x="51" y="58" fill="#a78bfa" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="800" text-anchor="middle">BLOCK</text>
    <text x="51" y="76" fill="#818cf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">#0 (16T)</text>

    <!-- Block 1: Physical Allocated -->
    <rect x="118" y="0" width="102" height="102" rx="18" fill="#0c4a6e" stroke="url(#blueGrad)" stroke-width="3" filter="url(#glow)" />
    <text x="169" y="58" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="800" text-anchor="middle">BLOCK</text>
    <text x="169" y="76" fill="#7dd3fc" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">#1 (PAGED)</text>

    <!-- Block 2: Speculative Verification Hit -->
    <rect x="0" y="118" width="102" height="102" rx="18" fill="#082f49" stroke="url(#blueGrad)" stroke-width="3" />
    <text x="51" y="176" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="800" text-anchor="middle">BLOCK</text>
    <text x="51" y="194" fill="#7dd3fc" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">#2 (CACHED)</text>

    <!-- Block 3: Continuous Batch Stream Core -->
    <rect x="118" y="118" width="102" height="102" rx="18" fill="#2e1065" stroke="url(#violetGrad)" stroke-width="3" filter="url(#glow)" />
    <!-- Dynamic Forward Warp Arrow -->
    <path d="M 148 169 L 188 169 M 172 153 L 188 169 L 172 185" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

